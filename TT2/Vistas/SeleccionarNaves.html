<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="./estilo/estilo_SeleccionarNaves.css" type="text/css"> <!-- Enlace al CSS -->
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="./imagenes/logo.jpg" alt="Logo LogistiClima" class="logo">
            <div class="title-container">
                <h1>LogistiClima</h1>
                <p class="subtitle">Optimizador de Rutas</p>
            </div>

        <button id="generarRuta"><b>Generar Ruta</b></button>

    <script src="./js/js_SeleccionarNaves.js"></script> <!-- Enlace al JS -->
