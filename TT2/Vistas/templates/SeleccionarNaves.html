<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogistiClima - Optimizador de Rutas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo/estilo_SeleccionarNaves.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo/estilo_auth.css') }}" type="text/css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='imagenes/logo.jpg') }}" alt="Logo LogistiClima" class="logo">
            <div class="title-container">
                <h1>LogistiClima</h1>
                <p class="subtitle">Optimizador de Rutas</p>
            </div>
        </div>
        
        <div class="login-button-container">
            {% if user_authenticated %}
                <div class="user-info">
                    <span class="welcome-text">¡Hola, {{ user_name }}!</span>
                    <a href="{{ url_for('rutas_recientes') }}" class="rutas-button">Mis Rutas</a>
                    <button id="cerrarSesion" class="logout-button">Cerrar Sesión</button>
                </div>
            {% else %}
                <a href="{{ url_for('iniciar_sesion') }}" class="login-button">Iniciar Sesión</a>
            {% endif %}
        </div>
    </header>

    <main>
        <div>
            <section class="tabla-section">
                <table>
                    <thead>
                        <tr>
                            <th>Seleccionar lugares deseados</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-lugares">
                    </tbody>
                </table>
            </section>
        </div>

        <button id="seleccionarTodo"><b>Seleccionar Todo</b></button>
        <div id="start-nave-container" style="display: none; margin-top: 20px; margin-bottom: 20px;">
            <label for="select-start-nave" style="font-weight: bold; font-size: 1.1em; display: block; margin-bottom: 10px;">
                Selecciona la Nave de Inicio:
            </label>
            <select id="select-start-nave" style="width: 100%; padding: 8px; border-radius: 5px;"></select>
        </div>
        <button id="generarRuta"><b>Optimizar Ruta</b></button>
    </main>

    <script src="{{ url_for('static', filename='js/js_SeleccionarNaves.js') }}"></script>
    <script>
        document.getElementById('generarRuta')?.addEventListener('click', function() {
            this.disabled = true;
            this.innerHTML = '<b>Optimizando...</b>';
        });

        document.getElementById('cerrarSesion')?.addEventListener('click', function() {
            this.disabled = true;
            this.textContent = 'Cerrando sesión...';
        });
    </script>

    <div id="overlay-espera">
        <div id="lottie-container"></div> <!-- Overlay fullscreen con animación Lottie -->
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.7.4/lottie.min.js"></script> <!-- Lottie Player -->
    
</body>
</html>
