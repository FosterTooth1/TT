<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogistiClima - Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilo/estilo_NuevaCuenta.css" type="text/css"> <!-- Enlace al CSS -->
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="./imagenes/logo.jpg" alt="Logo LogistiClima" class="logo">
            <div class="title-container">
                <h1>LogistiClima</h1>
                <p class="subtitle">Ingresa</p>
            </div>
        </div>
    </header>

    <main>
        <section class="form-section">
            <form id="registroForm">
                <div class="input-container">
                    <span class="icon">📧</span>
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-container">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit"><b>Iniciar Sesión</b></button>
            </form>
        </section>
    </main>

    <script src="./js/js_IniciarSesion.js"></script> <!-- Enlace al JS -->
</body>
</html>
