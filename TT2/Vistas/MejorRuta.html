<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogistiClima - Mejor Ruta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/estilo_MejorRuta.css" /> <!-- Enlace al CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" /> <!-- Para mostrar el Mapa -->
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="imagenes/logo.jpg" alt="Logo LogistiClima" class="logo">
            <div class="title-container">
                <h1>LogistiClima</h1>
                <p class="subtitle">Mejor Ruta Generada</p>
            </div>
        </div>
    </header>

    <main>
        <div class="contenido-principal">
            <div class="mapa-container">
                <div id="mapa"></div>
            </div>
            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>Destino</th>
                            <th>Nombre</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-mejor-ruta">
                        <!-- Los detalles de la ruta se mostraran aqui dinamicamente -->
                    </tbody>
                </table>
                <button id="guardarRuta">Guardar Ruta</button>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/js_MejorRuta.js"></script> <!-- Enlace al JS -->
</body>
</html>
